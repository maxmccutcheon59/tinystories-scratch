[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinystories-scratch"
version = "0.1.0"
description = "From-scratch PyTorch GPT demo related to TinyStories (Eldan & Li 2023)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Max McCutcheon", email = "MaxMcCutcheon1@outlook.com" },
]
keywords = ["tinystories", "gpt", "transformer", "pytorch", "language-model"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pip-audit>=2.7",
]
data = [
    "datasets>=2.14",
]

[project.urls]
Homepage = "https://github.com/maxmccutcheon59/tinystories-scratch"
Repository = "https://github.com/maxmccutcheon59/tinystories-scratch"
Issues = "https://github.com/maxmccutcheon59/tinystories-scratch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinystories_scratch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
